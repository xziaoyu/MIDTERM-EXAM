<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Amuma is a frontend social media prototype inspired by care, privacy, and self-expression.">
        <title>User profile | Amuma</title>
        <link rel="icon" href="../assets/img/logo.png" type="image/png">
        <link rel="stylesheet" href="../src/css/style.css">
        <script src="../src/js/store.js" defer></script>
        <script src="../src/js/main.js" defer></script>
    </head>
    <body data-page="profile">
        <a class="skip-link" href="#main">Skip to content</a>

        <header class="site-header">
            <div class="header-inner">
                <a class="brand" href="../index.html" aria-label="Amuma home">
                    <img src="../assets/img/logo.png" alt="" class="brand-logo">
                    <span>Amuma</span>
                </a>
                <nav aria-label="Main navigation">
                    <a href="../index.html">Feed</a>
                    <a href="../pages/profile.html" aria-current="page">Profile</a>
                    <a href="../pages/about.html">About Us</a>
                    <a href="../pages/login.html">Login</a>
                    <a href="../pages/signup.html">Signup</a>
                </nav>
            </div>
        </header>

        <main id="main" class="main-content">
            <section class="profile-card card">
	    <img class="profile-cover" src="../assets/img/miming.jpg" alt="Black and white cat pattern">
                <div class="profile-details">
                    <span class="profile-avatar" data-user-initial aria-hidden="true">AR</span>
                    <span class="eyebrow">PROFILE</span>
                    <h1 data-user-name>Jason</h1>
                    <p class="muted">@you</p>
                    <p id="profile-bio"></p>
                    <p class="profile-count"><strong id="post-count">0</strong> posts</p>
                </div>
            </section>

            <div class="profile-layout">
                <section class="card">
                    <h2>Edit your profile</h2>
                    <form id="profile-form">
                        <label for="display-name">Display name</label>
                        <input id="display-name" maxlength="40" required>
                        <label for="bio">Bio</label>
                        <textarea id="bio" maxlength="180" required></textarea>
                        <button type="submit" class="button">Save changes</button>
                    </form>
                    <p class="small-note">Use fictional details. Changes are local to this browser.</p>
                </section>

                <section>
                    <h2 class="section-title">Your stories</h2>
                    <div id="post-list"></div>
                </section>
            </div>
        </main>

        <footer class="site-footer">
            <p>Amuma — Your voice matters. Your privacy does too.</p>
            <small>Student frontend prototype. No real authentication.</small>
        </footer>

        <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
    </body>
</html>
